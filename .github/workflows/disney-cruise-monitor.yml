name: Disney Wish Transatlantic Cruise Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: disney-cruise-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check for the cruise and notify if it appears
        env:
          NTFY_TOPIC: "disney-wish-ta2027-6793aa000ba4d345"
        run: python scripts/disney_cruise_monitor/check_cruise.py

      - name: Commit state if it changed
        run: |
          if ! git diff --quiet -- scripts/disney_cruise_monitor/state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/disney_cruise_monitor/state.json
            git commit -m "Update Disney cruise monitor state [skip ci]"
            git push
          fi
